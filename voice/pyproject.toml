# [V] Soterra phone agent: Cartesia Line SDK custom agent that forwards each caller turn to the backend.
[project]
name = "soterra-voice"
version = "0.1.0"
description = "Soterra phone agent (Cartesia Line SDK). Owner: Leia."
readme = "README.md"
# Line SDK 0.2.x requires >=3.10; Cartesia's hosted builds support 3.9–3.13.
requires-python = ">=3.11,<3.14"
dependencies = [
  "cartesia-line>=0.2.19,<0.3",
  "httpx>=0.27",
  "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
